<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Puzzle Master</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <header id="encabezado-principal">

        <nav id="navegacion-principal">

            <a href="index.html">Inicio</a>
            <a href="instrucciones.html">Instrucciones</a>
            <a href="creadores.html">Creadores</a>

        </nav>

    </header>


    <main id="area-juego">

        <section id="informacion-juego">

            <h1>Puzzle Master</h1>

            <p id="nivel-actual">
                Nivel 1
            </p>

            <p id="puzzle-actual">
                Puzzle 1
            </p>

            <p id="contador-movimientos">
                Movimientos: <span id="movimientos">0</span>
            </p>

        </section>


        <section id="tablero-puzzle" aria-label="Tablero del rompecabezas">

            <div class="pieza" id="pieza-1">
                1
            </div>

            <div class="pieza" id="pieza-2">
                2
            </div>

            <div class="pieza" id="pieza-3">
                3
            </div>

            <div class="pieza" id="pieza-4">
                4
            </div>

            <div class="pieza" id="pieza-5">
                5
            </div>

            <div class="pieza" id="pieza-6">
                6
            </div>

            <div class="pieza" id="pieza-7">
                7
            </div>

            <div class="pieza" id="pieza-8">
                8
            </div>

            <div class="espacio-vacio" id="espacio-vacio">
            </div>

        </section>


        <section id="controles-juego">

            <button type="button" id="btn-reiniciar">
                Reiniciar
            </button>

            <a href="puzzles.html" id="btn-salir">
                Salir
            </a>

        </section>

    </main>


    <footer id="pie-principal">

        <p>&copy; 2026 Puzzle Master</p>

    </footer>

</body>

</html>
